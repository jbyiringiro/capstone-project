services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vuga
      POSTGRES_PASSWORD: vuga
      POSTGRES_DB: vuga
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      VUGA_DATABASE_URL: postgresql+psycopg://vuga:vuga@db:5432/vuga
      VUGA_JWT_SECRET: ${VUGA_JWT_SECRET:?Set VUGA_JWT_SECRET to a random string of at least 32 characters}
      VUGA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173","http://localhost:4175","http://127.0.0.1:4175"]'
      VUGA_EMAIL_AUTH_PROVIDER: ${VUGA_EMAIL_AUTH_PROVIDER:-neon}
      VUGA_NEON_AUTH_URL: ${VUGA_NEON_AUTH_URL:-}
      VUGA_NEON_AUTH_ORIGIN: ${VUGA_NEON_AUTH_ORIGIN:-http://localhost:5173}
      VUGA_NEON_DELETE_ENABLED: ${VUGA_NEON_DELETE_ENABLED:-false}
      VUGA_SMS_LOG_ENABLED: "false"
    volumes:
      - ./ml/artifacts:/srv/ml/artifacts:ro
      - media:/srv/media
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
  media:
