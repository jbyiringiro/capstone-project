# Free frontend + API. PostgreSQL is supplied by Neon (docs/hosting.md).
# Keep the repository root: the app and API both import files from vocab/.
services:
  - type: web
    name: vuga-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: VUGA_DATABASE_URL
        sync: false
      - key: VUGA_JWT_SECRET
        generateValue: true
      - key: VUGA_CORS_ORIGINS
        sync: false
      - key: VUGA_MODEL_DIR
        value: /srv/ml/artifacts
      - key: VUGA_DEFAULT_MODEL
        value: kn_trigram.json
      - key: VUGA_SMS_LOG_ENABLED
        value: "false"

  - type: web
    name: vuga-app
    runtime: static
    buildCommand: cd app && npm ci && npm test && npm run build
    staticPublishPath: ./app/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: VITE_API_BASE
        fromService:
          type: web
          name: vuga-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
